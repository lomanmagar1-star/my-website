<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Body Guide</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="body-page">

        <div class="body-container">

            <!-- BODY IMAGE -->

            <img src="background.png" alt="Body Anatomy">

            <!-- FRONT BODY -->

            <button class="dot chest-dot" onclick="showPopup('Chest Workout')"></button>

            <button class="dot shoulder-dot" onclick="showPopup('Shoulder Workout')"></button>

            <button class="dot arm-dot" onclick="showPopup('Arm Workout')"></button>

            <button class="dot abs-dot" onclick="showPopup('Abs Workout')"></button>

            <button class="dot forearm-dot" onclick="showPopup('Forearm Workout')"></button>

            <button class="dot quad-dot" onclick="showPopup('Leg Workout')"></button>

            <button class="dot calf-dot" onclick="showPopup('Calf Workout')"></button>

            <!-- BACK BODY -->

            <button class="dot back-dot" onclick="showPopup('Back Workout')"></button>

            <button class="dot trap-dot" onclick="showPopup('Trap Workout')"></button>

            <button class="dot tricep-dot" onclick="showPopup('Tricep Workout')"></button>

            <button class="dot glute-dot" onclick="showPopup('Glute Workout')"></button>

            <button class="dot hamstring-dot" onclick="showPopup('Hamstring Workout')"></button>

            <button class="dot backcalf-dot" onclick="showPopup('Calf Workout')"></button>

        </div>

    </section>

    <!-- POPUP -->

    <div class="popup" id="popup">

        <div class="popup-box">

            <span class="close-btn" onclick="closePopup()">×</span>

            <h2 id="popup-title">Workout</h2>

            <p>
                Professional workout exercises and training guides.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
