<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Body Guide</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="body-page">

        <div class="body-container">

            <!-- BODY IMAGE -->

            <img src="background.png" alt="Body Anatomy">

            <!-- DOTS -->

            <button class="dot chest-dot" onclick="openPopup()"></button>

            <button class="dot arm-dot" onclick="openPopup()"></button>

            <button class="dot thigh-dot" onclick="openPopup()"></button>

            <button class="dot back-dot" onclick="openPopup()"></button>

            <button class="dot leg-dot" onclick="openPopup()"></button>

        </div>

    </section>

    <!-- POPUP -->

    <div class="popup" id="popup">

        <div class="popup-box">

            <span class="close-btn" onclick="closePopup()">×</span>

            <h2>Exercise Guide</h2>

            <p>
                Workout guide coming soon.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
