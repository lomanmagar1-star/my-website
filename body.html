<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Guide</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="body-page">

        <div class="body-container">

            <!-- BODY IMAGE -->

            <img src="background.png" alt="Body Anatomy">

            <!-- FRONT BODY -->

            <button class="dot chest-dot" onclick="showPopup('Chest Workout')">
                <span>CHEST</span>
            </button>

            <button class="dot arm-dot" onclick="showPopup('Arm Workout')">
                <span>ARMS</span>
            </button>

            <button class="dot abs-dot" onclick="showPopup('Abs Workout')">
                <span>ABS</span>
            </button>

            <button class="dot leg-dot" onclick="showPopup('Leg Workout')">
                <span>LEGS</span>
            </button>

            <!-- BACK BODY -->

            <button class="dot back-dot" onclick="showPopup('Back Workout')">
                <span>BACK</span>
            </button>

            <button class="dot glute-dot" onclick="showPopup('Glute Workout')">
                <span>GLUTES</span>
            </button>

            <button class="dot calf-dot" onclick="showPopup('Calf Workout')">
                <span>CALVES</span>
            </button>

        </div>

    </section>

    <!-- POPUP -->

    <div class="popup" id="popup">

        <div class="popup-box">

            <span class="close-btn" onclick="closePopup()">×</span>

            <h2 id="popup-title">Workout</h2>

            <p>
                Professional workout exercises and training guides.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
