<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Body Guide</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BACKGROUND MUSIC -->

    <audio autoplay loop>

        <source src="gym.mp3" type="audio/mpeg">

    </audio>

    <!-- HOME BUTTON -->

    <a href="index.html" class="home-btn">

        HOME

    </a>

    <!-- BODY PAGE -->

    <section class="body-page">

        <div class="body-container">

            <!-- BODY IMAGE -->

            <img src="background.png" alt="Body Anatomy">

            <!-- DOTS -->

            <div class="dot chest-dot" onclick="showGuide('chest')"></div>

            <div class="dot arm-dot" onclick="showGuide('arm')"></div>

            <div class="dot thigh-dot" onclick="showGuide('thigh')"></div>

            <div class="dot back-dot" onclick="showGuide('back')"></div>

            <div class="dot leg-dot" onclick="showGuide('calves')"></div>

        </div>

    </section>

    <!-- POPUP -->

    <div class="popup" id="popup">

        <div class="popup-box">

            <span class="close-btn" onclick="closePopup()">×</span>

            <h2 id="popup-title">
                Exercise Guide
            </h2>

            <p id="popup-text">
                Workout guide appears here.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
