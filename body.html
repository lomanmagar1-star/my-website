<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Body Guide</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="body-page">

        <div class="body-container">

            <!-- BODY IMAGE -->

            <img src="background.png" alt="Body Anatomy">

            <!-- DOTS -->

            <div class="dot chest-dot" onclick="openBox('Chest Exercises')"></div>

            <div class="dot arm-dot" onclick="openBox('Arm Exercises')"></div>

            <div class="dot leg-dot" onclick="openBox('Leg Exercises')"></div>

        </div>

    </section>

    <!-- POPUP BOX -->

    <div class="popup" id="popup">

        <div class="popup-content">

            <span class="close-btn" onclick="closeBox()">×</span>

            <h2 id="popup-title">Exercises</h2>

            <p>
                Workout guides will appear here.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
